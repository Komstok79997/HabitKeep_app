name: med_history_app
description: "Застосунок для формування та контролю звичок (HabitKeep)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^2.0.0

  # База даних SQLite
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.4

  # Збереження сесії користувача
  shared_preferences: ^2.3.2

  # ПРИМУСОВО ОНОВЛЕНІ ПАКЕТИ ПІД ANDROID SDK 36
  file_picker: ^13.4.0
  image_picker: ^1.1.2
  open_filex: ^5.0.0

  # Форматування дат
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true